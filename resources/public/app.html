<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingman Interview</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false });
window.renderAssistantMarkdown = function(root){
  var raws = root.querySelectorAll('pre.assistant-raw:not([data-rendered])');
  if (!raws.length) return;
  root.querySelectorAll('.assistant-stream').forEach(function(el){ el.remove(); });
  raws.forEach(function(el){
    var target = el.nextElementSibling;
    if (!target) return;
    var wrapper = document.createElement('div');
    wrapper.innerHTML = marked.parse(el.textContent);
    wrapper.querySelectorAll('pre code.language-mermaid').forEach(function(code){
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      var pre = code.parentElement;
      if (pre && pre.tagName === 'PRE') {
        pre.parentNode.replaceChild(div, pre);
      } else {
        code.parentNode.replaceChild(div, code);
      }
    });
    target.innerHTML = DOMPurify.sanitize(wrapper.innerHTML);
    el.dataset.rendered = "1";
  });
  mermaid.run({ nodes: root.querySelectorAll('.assistant-rendered .mermaid') });
};
</script>
</head>
<body class="h-screen flex flex-col bg-slate-100 text-slate-800"
      hx-ext="sse" sse-connect="/events">

<div class="flex flex-1 min-h-0">

  <aside id="sessions-sidebar" class="w-[260px] flex-none bg-slate-900 text-slate-200 flex flex-col" data-panel="sessions">
    <div class="px-4 py-3 text-sm font-semibold tracking-wide text-slate-100 border-b border-slate-700">
      Sessions
      <a href="/new" class="float-right text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-0.5 rounded">+ New</a>
    </div>
    <nav class="flex-1 overflow-y-auto text-sm">
      <ul id="session-list" hx-get="/sessions" hx-trigger="load" hx-swap="innerHTML"></ul>
    </nav>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <!--CONTEXT_HEADER-->
    <main id="transcript-panel" class="h-[30%] min-h-0 flex-none flex flex-col bg-white" data-panel="transcript">
      <div class="px-4 py-3 border-b border-slate-200 text-sm font-semibold">Transcript</div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" sse-swap="transcript" hx-swap="none"></div>
    </main>

    <aside id="assistant-panel" class="flex-1 min-h-0 flex flex-col bg-slate-50 border-t border-slate-200" data-panel="assistant">
      <div class="px-4 py-3 text-sm font-semibold border-b border-slate-200">Assistant</div>
      <div id="assistant-output" class="flex-1 overflow-y-auto p-4"
           sse-swap="assistant" hx-swap="beforeend"></div>
      <form id="chat-form" class="p-3 border-t border-slate-200 flex gap-2"
            hx-post="/api/session/SESSION_ID/chat" hx-swap="none"
            hx-on::after-request="this.reset()">
        <input type="text" name="message" autocomplete="off"
               class="flex-1 text-sm rounded border-slate-300" placeholder="Type a message…">
        <button type="submit" class="text-xs bg-indigo-600 text-white px-3 rounded">Send</button>
      </form>
    </aside>
  </div>

</div>

<footer class="h-12 flex-none bg-slate-900 text-slate-100 flex items-center px-4 gap-3 text-sm">
  <span id="st-session" class="text-xs text-slate-400 flex items-center gap-1"><span class="st-dot w-2 h-2 rounded-full bg-slate-500"></span><span class="st-label">none</span></span>
  <span id="st-clip" class="text-xs text-slate-400 flex items-center gap-1"><span class="st-dot w-2 h-2 rounded-full bg-slate-500"></span><span class="st-label">clip —</span></span>
  <span id="st-mic" class="text-xs text-slate-400 flex items-center gap-1"><span class="st-dot w-2 h-2 rounded-full bg-slate-500"></span><span class="st-label">mic —</span></span>
  <span id="st-call" class="text-xs text-slate-400 flex items-center gap-1"><span class="st-dot w-2 h-2 rounded-full bg-slate-500"></span><span class="st-label">call —</span></span>
  <span id="st-assistant" class="text-xs text-slate-400 flex items-center gap-1"><span class="st-dot w-2 h-2 rounded-full bg-slate-500"></span><span class="st-label">assistant idle</span></span>
  <span class="flex-1"></span>
  <button id="mute-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Mute</button>
  <button id="pause-voice-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Pause voice</button>
  <button id="pause-text-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Pause text</button>
  <button id="clear-transcript" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Clear transcript</button>
  <button id="edit-context" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Edit context</button>
  <span id="session-timer" class="font-mono">00:00:00</span>
</footer>

<script>
(function(){
  var output = document.getElementById('assistant-output');
  if (!output) return;
  var timer = null;
  var obs = new MutationObserver(function(){
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){
      window.renderAssistantMarkdown(output);
    }, 50);
  });
  obs.observe(output, { childList: true, subtree: true });
})();
</script>

<script>
(function(){
  function ageClass(seconds){ return seconds <= 10 ? 'bg-emerald-500' : seconds <= 30 ? 'bg-amber-500' : 'bg-rose-500'; }
  function ageText(ts, now){ if (!ts) return '—'; var s = Math.round((now - ts) / 1000); return s + 's ago'; }
  function set(id, text, cls){
    var el = document.getElementById(id); if (!el) return;
    var label = el.querySelector('.st-label'); if (label) label.textContent = text;
    var dot = el.querySelector('.st-dot'); if (dot) dot.className = 'st-dot w-2 h-2 rounded-full ' + cls;
  }
  function update(){
    fetch('/api/status').then(function(r){ return r.json(); }).then(function(d){
      var now = d.now || Date.now();
      var session = d.session || 'none';
      set('st-session', 'session ' + (session.length > 8 ? session.slice(0,8) : session), session !== 'none' ? 'bg-emerald-500' : 'bg-slate-500');
      var clip = d.last_clipboard ? Math.round((now - d.last_clipboard)/1000) : null;
      set('st-clip', 'clip ' + (clip !== null ? clip + 's ago' : '—'), clip !== null ? ageClass(clip) : 'bg-slate-500');
      var micTs = d.last_audio && d.last_audio.candidate;
      var mic = micTs ? Math.round((now - micTs)/1000) : null;
      set('st-mic', 'mic ' + (mic !== null ? mic + 's ago' : '—'), mic !== null ? ageClass(mic) : 'bg-slate-500');
      var callTs = d.last_audio && d.last_audio.interviewer;
      var call = callTs ? Math.round((now - callTs)/1000) : null;
      set('st-call', 'call ' + (call !== null ? call + 's ago' : '—'), call !== null ? ageClass(call) : 'bg-slate-500');
      var turnAge = d.last_turn ? Math.round((now - d.last_turn)/1000) : null;
      var assistantText = 'assistant ' + (d.turn_state || 'idle') + (turnAge !== null ? ' ' + turnAge + 's ago' : '');
      set('st-assistant', assistantText, d.turn_state === 'thinking' ? 'bg-amber-500' : (turnAge !== null ? ageClass(turnAge) : 'bg-slate-500'));
    }).catch(function(){});
  }
  update();
  setInterval(update, 1500);
})();
</script>

<!--CONTEXT_EDITOR-->

<!-- subscribes to the SSE "clear" event so htmx fires htmx:sseMessage for it -->
<div sse-swap="clear" hx-swap="none" hidden></div>
<script>
(function(){
  document.body.addEventListener('htmx:sseMessage', function(e){
    if (e.detail && e.detail.type === 'clear') {
      var tc = document.querySelector('[sse-swap="transcript"]');
      if (tc) tc.innerHTML = '';
      var ao = document.getElementById('assistant-output');
      if (ao) ao.innerHTML = '';
    }
  });
})();
</script>
</body>
</html>
