<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingman Interview</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false });
window.renderAssistantMarkdown = function(root){
  root.querySelectorAll('.assistant-stream').forEach(function(el){ el.remove(); });
  root.querySelectorAll('pre.assistant-raw').forEach(function(el){
    var target = el.nextElementSibling;
    if (!target) return;
    var wrapper = document.createElement('div');
    wrapper.innerHTML = marked.parse(el.textContent);
    wrapper.querySelectorAll('pre code.language-mermaid').forEach(function(code){
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      var pre = code.parentElement;
      if (pre && pre.tagName === 'PRE') {
        pre.parentNode.replaceChild(div, pre);
      } else {
        code.parentNode.replaceChild(div, code);
      }
    });
    target.innerHTML = DOMPurify.sanitize(wrapper.innerHTML);
  });
  mermaid.run({ nodes: root.querySelectorAll('.assistant-rendered .mermaid') });
};
</script>
</head>
<body class="h-screen flex flex-col bg-slate-100 text-slate-800"
      hx-ext="sse" sse-connect="/events">

<div class="flex flex-1 min-h-0">

  <aside id="sessions-sidebar" class="w-[260px] flex-none bg-slate-900 text-slate-200 flex flex-col" data-panel="sessions">
    <div class="px-4 py-3 text-sm font-semibold tracking-wide text-slate-100 border-b border-slate-700">
      Sessions
      <button class="float-right text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-0.5 rounded">+ New</button>
    </div>
    <nav class="flex-1 overflow-y-auto text-sm">
      <ul id="session-list" hx-get="/sessions" hx-trigger="load" hx-swap="innerHTML"></ul>
    </nav>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <main id="transcript-panel" class="h-[30%] min-h-0 flex-none flex flex-col bg-white" data-panel="transcript">
      <div class="px-4 py-3 border-b border-slate-200 text-sm font-semibold">Transcript</div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" sse-swap="transcript" hx-swap="none"></div>
    </main>

    <aside id="assistant-panel" class="flex-1 min-h-0 flex flex-col bg-slate-50 border-t border-slate-200" data-panel="assistant">
      <div class="px-4 py-3 text-sm font-semibold border-b border-slate-200">Assistant</div>
      <div id="assistant-output" class="flex-1 overflow-y-auto p-4"
           sse-swap="assistant" hx-swap="beforeend"></div>
      <form id="chat-form" class="p-3 border-t border-slate-200 flex gap-2"
            hx-post="/api/session/SESSION_ID/chat" hx-swap="none">
        <input type="text" name="message" autocomplete="off"
               class="flex-1 text-sm rounded border-slate-300" placeholder="Type a message…">
        <button type="submit" class="text-xs bg-indigo-600 text-white px-3 rounded">Send</button>
      </form>
    </aside>
  </div>

</div>

<footer class="h-12 flex-none bg-slate-900 text-slate-100 flex items-center px-4 gap-3 text-sm">
  <span class="flex-1"></span>
  <button id="mute-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Mute</button>
  <button id="pause-voice-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Pause voice</button>
  <button id="pause-text-toggle" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded">Pause text</button>
  <span id="session-timer" class="font-mono">00:00:00</span>
</footer>

<script>
(function(){
  var output = document.getElementById('assistant-output');
  if (!output) return;
  var timer = null;
  var obs = new MutationObserver(function(){
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){
      window.renderAssistantMarkdown(output);
    }, 50);
  });
  obs.observe(output, { childList: true, subtree: true });
})();
</script>

</body>
</html>
